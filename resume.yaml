        position: Senior Full-Stack Engineer
        location: San Francisco, CA
        start: 2021-03
        end: present
        summary: Leads platform work across product, design, and infrastructure teams.
        highlights:
          - Redesigned a fragile release process into a shared delivery platform that reduced lead time by 45% while preserving team ownership, auditability, and safe rollback paths across four product groups.
          - Mentored six engineers through architecture reviews, pairing sessions, and written decision records that helped each team make clearer technical choices without depending on a central approval group.
        keywords:
          - TypeScript
          - Vue
          - Node.js
          - PostgreSQL

